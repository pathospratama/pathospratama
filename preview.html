<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathos Kratos — Snake System Preview</title>
<style>
  :root { color-scheme:dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#aa9bef; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { width:min(1180px,calc(100% - 28px)); margin:auto; padding:38px 0 60px; }
  h1 { margin:0 0 7px; color:var(--accent); }
  h2 { margin:42px 0 16px; padding-bottom:9px; border-bottom:1px solid var(--border); color:var(--muted); text-transform:uppercase; letter-spacing:.14em; font-size:12px; }
  p { color:var(--muted); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; overflow:auto; }
  .label { margin-bottom:12px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.08em; }
  img { display:block; width:100%; height:auto; }
  .buttons { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  button { cursor:pointer; color:var(--text); background:transparent; border:1px solid var(--border); padding:7px 12px; border-radius:999px; }
  button:hover { color:var(--accent); border-color:var(--accent); }
  @media (max-width:820px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Pathos Kratos — Snake System</h1>
  <p>Repository-owned contribution renderer with head/body animation, bite pulse, cell consumption, respawn loop, and dark/light variants.</p>
  <div class="buttons">
    <button id="reload">Replay local SVG</button>
  </div>

  <h2>Local sample</h2>
  <div class="row">
    <div class="card"><div class="label">Light</div><img id="light" src="assets/snake-preview-light.svg" alt="Light sample snake"></div>
    <div class="card"><div class="label">Dark</div><img id="dark" src="assets/snake-preview-dark.svg" alt="Dark sample snake"></div>
  </div>

  <h2>Live output branch</h2>
  <div class="card"><div class="label">GitHub light</div><img src="https://raw.githubusercontent.com/pathospratama/pathospratama/output/github-contribution-snake-light.svg" alt="Live light contribution snake"></div>
  <div class="card"><div class="label">GitHub dark</div><img src="https://raw.githubusercontent.com/pathospratama/pathospratama/output/github-contribution-snake-dark.svg" alt="Live dark contribution snake"></div>

  <h2>Existing Pathos assets</h2>
  <div class="row">
    <div class="card"><div class="label">Banner dark</div><img src="assets/banner-dark.v9.svg" alt="Pathos dark banner"></div>
    <div class="card"><div class="label">Banner light</div><img src="assets/banner-light.v9.svg" alt="Pathos light banner"></div>
  </div>
</main>
<script>
  document.getElementById('reload').addEventListener('click', () => {
    for (const id of ['light','dark']) {
      const img = document.getElementById(id);
      img.src = img.src.split('?')[0] + '?t=' + Date.now();
    }
  });
</script>
</body>
</html>
