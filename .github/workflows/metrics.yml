name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/language_card.py"
      - "scripts/language-sample.json"

permissions:
  contents: write

concurrency:
  group: pathos-metrics
  cancel-in-progress: true

jobs:
  languages:
    name: Build language analytics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/language_card.py \
            --user pathospratama \
            --output assets/metrics.languages.svg

      - name: Commit generated asset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/metrics.languages.svg

          if git diff --cached --quiet; then
            echo "No language analytics changes."
            exit 0
          fi

          git commit -m "chore: refresh language analytics"
          git push
